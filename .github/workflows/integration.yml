name: Integration Tests

on:
  pull_request:
    branches: [reboot]
  schedule:
    - cron: '0 6 * * 1-5'  # Lundi-vendredi 6h UTC

jobs:
  backend-integration:
    name: Backend Integration (Go + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: revisemieux_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/revisemieux_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Integration tests
        run: |
          set -o pipefail
          # Emit JSON to a file (consumed by the anti-skip guardrail) and
          # extract the human-readable output lines to the CI log.
          # fromjson? silently drops any non-JSON line (e.g. `go: downloading`).
          # stderr intentionally NOT redirected into the pipe — it goes to the CI log directly.
          go test -tags=integration -p 1 ./... -count=1 -json \
            | tee /tmp/itest.json \
            | jq -jR 'fromjson? | select(.Output != null) | .Output'
        shell: bash

      - name: Fail on skipped tests (postgres + handler only)
        run: |
          set -e
          # Only packages that depend on TEST_DATABASE_URL are mandatory.
          # s3 (MinIO) and ocr (external API keys) may legitimately skip.
          skipped=$(jq -r '
            select(.Action == "skip" and .Test != null)
            | select(.Package | test("internal/infra/postgres|internal/http/handler"))
            | "\(.Package) \(.Test)"
          ' /tmp/itest.json)
          if [ -n "$skipped" ]; then
            echo "::error::Mandatory integration tests were skipped (silent failure):"
            echo "$skipped"
            exit 1
          fi
          echo "No mandatory skips — OK"
        shell: bash
