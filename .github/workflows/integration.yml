name: Integration Tests

on:
  pull_request:
    branches: [reboot]
  schedule:
    - cron: '0 6 * * 1-5'  # Lundi-vendredi 6h UTC

jobs:
  backend-integration:
    name: Backend Integration (Go + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: revisemieux_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/revisemieux_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Integration tests
        run: go test -tags=integration -p 1 ./... -v -count=1
