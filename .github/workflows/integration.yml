name: Integration Tests

on:
  pull_request:
    branches: [reboot]
  schedule:
    - cron: '0 6 * * 1-5'  # Lundi-vendredi 6h UTC

jobs:
  backend-integration:
    name: Backend Integration (Go + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: revisemieux_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/revisemieux_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Integration tests
        run: go test -tags=integration -p 1 ./... -count=1 -json | tee /tmp/itest.json | go tool test2json -t 2>/dev/null || (cat /tmp/itest.json; exit 1)
        shell: bash

      - name: Fail on skipped tests
        run: |
          set -e
          skipped=$(jq -r 'select(.Action == "skip" and .Test != null) | "\(.Package) \(.Test)"' /tmp/itest.json)
          if [ -n "$skipped" ]; then
            echo "::error::Integration tests were skipped (not allowed — a skipped integration test is a silent failure):"
            echo "$skipped"
            exit 1
          fi
          echo "No skipped tests — OK"
        shell: bash
