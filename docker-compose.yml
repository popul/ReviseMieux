services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: revisemieux-db
    environment:
      POSTGRES_USER: revisemieux
      POSTGRES_PASSWORD: revisemieux
      POSTGRES_DB: revisemieux
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revisemieux"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: revisemieux-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revisemieux-backend
    environment:
      DATABASE_URL: postgres://revisemieux:revisemieux@db:5432/revisemieux?sslmode=disable
      PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STORAGE_PATH: /app/storage
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: revisemieux
      S3_USE_SSL: "false"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
    # NOTE: Volume mount commented out - it overwrites the compiled binary
    # Uncomment and use 'air' for hot-reload development:
    # volumes:
    #   - ./backend:/app
    # command: air

  # Frontend (static files served by nginx in prod, or dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: revisemieux-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
  minio_data:
