services:
  # -----------------------------------------------------------
  # PostgreSQL 16
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revisemieux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revisemieux}
      POSTGRES_DB: ${POSTGRES_DB:-revisemieux}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revisemieux}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # PostgreSQL 16 — test database (isolated, port 5433)
  # -----------------------------------------------------------
  postgres-test:
    image: postgres:16-alpine
    container_name: rm-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: revisemieux_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - test

  # -----------------------------------------------------------
  # Redis 7
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rm-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # MinIO (S3-compatible, dev only)
  # -----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: rm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    profiles:
      - storage

  # -----------------------------------------------------------
  # Backend API (uncomment for containerised backend)
  # -----------------------------------------------------------
  # backend:
  #   build: ./backend
  #   ports: ['8080:8080']
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   env_file: .env

volumes:
  pg_data:
  redis_data:
  minio_data:
