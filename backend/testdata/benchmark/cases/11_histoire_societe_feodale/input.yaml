    block_type: TEXT
    confidence: 1
  - text: |
      Problématique : Comment les seigneurs dominaient-ils les campagnes entre le XI ème et le XV ème siècle ?
      Quels liens existent-ils entre les hommes dans la société féodale à partir du XI ème siècle ?
      Quelle est la place de l'Eglise dans la société médiévale (= du moyen-âge )?
    block_type: TEXT
    confidence: 1
  - text: I- UNE société seigneuriale dans les campagnes
    block_type: TEXT
    confidence: 1
  - text: A- La formation des campagnes
    block_type: TEXT
    confidence: 1
  - text: "1) Comment les forêts se forment-elles du XI ème au XIV ème siècle ? Entre 300 et 1300, la surface forestière diminue considérablement en raison des grands défrichements."
    block_type: TEXT
    confidence: 1
  - text: "Défrichement : abattage des arbres et des broussailles pour rendre la terre cultivable."
    block_type: TEXT
    confidence: 1
  - text: "1) Comment évolue la population européenne au MA ? Entre 900 et 1350 l'Europe passe de 23,5 millions à 57,5 millions, soit 34 millions d'habitants en plus."
    block_type: TEXT
    confidence: 1
  - text: Pourquoi cette augmentation ? C'est grâce à l'assellement triennal
    block_type: TEXT
    confidence: 1
  - text: "Jachère: La terre est laissée au repos pendant un an pour retrouver sa fertilité."
    block_type: TEXT
    confidence: 1
  - text: "1) Que font les personnages sur cette tapisserie ? Quel est l'objectif d'une tell action ? Les hommes défrichent les forêts en coupant les arbees pour conquérir de nouvelles terres afin de nourrir la population devenue plus nombreuse."
    block_type: TEXT
    confidence: 1
  - text: Quels  progrès techniques permettent les défrichements ? L'usage du fer est de plus en plus important dans les outils, ce qui a permis la diffusion de la hashe. La nouvelle charrue permet d'arracher les souches des arbres et de labourer plus facilement les terres nouvelles.
    block_type: TEXT
    confidence: 1
  - text: |
      1- Quel personnage a acheté de nouvelles terres ?
      C'est l'archevequede de Magdebourg.
    block_type: TEXT
    confidence: 1
  - text: "2- Que décide-t-il de faire avec ?  Il les prête à Werner et Gottfried pour qu'ils les mettent en valeur avec de nouveaux habitants et donc de fonder ainsi un nouveau village."
    block_type: TEXT
    confidence: 1
  - text: |
      3- Les habitants vont-ils payer de nombreuses taxes ?
       Oui, ils paieront uniquement le cens, une fois par an et une fois les terres rendues fertiles.
    block_type: TEXT
    confidence: 1
  - text: |
