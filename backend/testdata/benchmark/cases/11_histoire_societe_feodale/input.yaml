  - text: |
      1: Quels sont les éléments  composant une seigneurie ?
      La seigneurie est composée d'un château et des terres aux alentours, terres cultivables, forêts, rivières, et aussi les terres sur lesquelles les paysans s'installent, le village.
    block_type: TEXT
    confidence: 1
  - text: |
      3- Vivre au village au Moyen Age
      Docs p78 à 81
      Equipe 2: La communauté villageoise
      1: A chaque fois que les villageoins utilisent une propriété du seignuer, ils doivent payer un impôt.
    block_type: TEXT
    confidence: 1
  - text: Les paysans doivent tout au seigneur mais ce dernier ne leur doit rien en retour à part la sécurité
    block_type: TEXT
    confidence: 1
  - text: |
      Correction Q1:
      Equipe 1: Les paysans labourent les graines avec la charrue, sement les graines fauchent et battent le blé avec un fléau,  et ramassent les glands. Ils peuvent également faire de l'élevage, être meuniers ou encore sauniers.
      Q2: Les conditions de travail sont très difficiles. Ils travaillent en toute saison, de l'aube au coucher du soleil.
      Q1: Au sein des communautés villageoises, les paysons élisent des représentants pour faire appliqer les décissions.
      Q2:
      Les paysons dépendent du seigneur, ils sont soumis à son pouvoir. La plupart sont des serfs, des payons qui appartiennent au seigneur et ne peuvent ni se marier, ni quitter leur terre sans l'accord du
    block_type: TEXT
    confidence: 1
