  - text: |
      Trace écrite :
      Dès la fin du Xème siècle, l'Occident se couvre d'églises. Les églises romanes sont généralement construites selon un plan en forme de croix latine. Le chœur, orienté vers Jérusalem, représente la tête du Christ ; la nef, son corps et le transept, ses bras.
      Les églises attirent les fidèles de plus en plus nombreux qui viennent y prier et y vénérer des reliques. Ils se réunissent dans la nef dont le plafond est soutenu par des voûtes. À l'extérieur des contreforts soutiennent l'édifice.
      Ces églises sont très sombres (petites fenêtres) et ont un aspect massif. Le décor est composé de sculptures (tympan) et de fresques qui racontent des scènes de la Bible car la majorité des Chrétiens ne savent pas lire. L'enfer est représenté afin que les chrétiens sachent ce qui les attend s'ils ne respectent pas les règles de l'Église.
      Reliques : restes de saints ou d'objets, vénérés par les fidèles qui en espèrent des miracles
    block_type: TEXT
    confidence: 1
