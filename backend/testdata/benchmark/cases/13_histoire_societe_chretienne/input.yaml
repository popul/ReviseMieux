  - text: "[Schéma : Organisation de l'Église. En haut, un pape (étiqueté 'pape') est au sommet. Une flèche 'élisent' pointe vers lui depuis un groupe de cardinaux (étiqueté 'cardinaux'). Une flèche 'nomme' part du pape vers les cardinaux. Le pape est connecté à deux branches : 'clergé séculier' (étiqueté 'séculier') et 'clergé régulier' (étiqueté 'régulier'). Le clergé séculier est divisé en 'diocèses' (avec un évêque, étiqueté 'évêque') et 'paroisses' (avec des curés, étiqueté 'curés'). Le clergé régulier est divisé en 'abbayes' (avec un abbé, étiqueté 'abbé') et des moines (étiqueté 'moines'). En bas, un groupe de 'Les laïcs' est montré. Une légende en bas indique : 'Les laïcs (tous ceux qui n'appartiennent pas au clergé) font des dons et paient un impôt (la dîme) à l'Église, qui devient riche et très puissante.']"
    block_type: DIAGRAM
