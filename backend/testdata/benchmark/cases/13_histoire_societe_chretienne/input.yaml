  - text: |
      Les obligations du fidèle
      « Tout fidèle, homme ou femme, doit lui-même confesser ses péchés, sans témoin, à son propre curé au moins une fois par an.
      Il doit accomplir avec soin, dans la mesure de ses moyens, la pénitence qui lui est imposée.
      Il doit communier au moins à Pâques.
      S'il n'obéit pas, qu'il lui soit interdit d'entrer dans une église de son vivant et qu'il soit privé de sépulture chrétienne après sa mort.
      Que ce décret soit souvent lu publiquement dans les églises pour que personne ne l'ignore. »
      D'après le concile de Latran IV (assemblée qui réunit le pape et les évêques), 1215.
      1. Un chrétien de l'Église catholique.
      2. Une peine imposée par le prêtre ou l'évêque pour sanctionner un péché.
    block_type: TEXT
    confidence: 1
  - text: |
      1 - Quelles sont les obligations des fidèles ?
      Les obligations des fidèles sont: confesser leurs péchés au curé au moins une fois par an, accomplir la pénitence qui leur est imposé et de communier au moins à Pâques.
  - text: |
      2- Quelle est leur punition en cas de désobéissance ?
      En cas de désobéissance, il lui est interdit d'entrer dans une église jusqu'à la fin de sa vie et qu'il soit dépourvu de sépulture chrétienne jusqu'à sa mort.
    block_type: TEXT
    confidence: 1
  - text: |
      Le testament d'un chrétien
      « Moi, Bernard, seigneur d'Albret, voulant pourvoir au salut de mon âme, je veux que soient données aux monastères les sommes indiquées ci-dessous [...]
      De même, je donne des sommes à tous les hôpitaux qui sont sur le chemin de Saint Jacques.
      De même, comme j'ai promis de faire cinq pèlerinages, je veux que ces pèlerinages soient faits par mes fils.
      En outre, je veux que 10000 livres tournois soient distribuées pour faire de bonnes aumônes, là où mes exécuteurs testamentaires jugeront qu'elles seront les mieux employées pour le salut de mon âme. »
      D'après le testament de Bernard, seigneur d'Albret, XIVe siècle.
      1. Saint-Jacques de Compostelle, en Espagne, grand lieu de pèlerinage.
    block_type: TEXT
    confidence: 1
  - text: |
      3 : Qui bénéficie des dispositions du testament ? Qu'est-ce que le seigneur espère obtenir en échange ?
      Ceux qui bénéficient des dispositions du testament sont l'Église. Il espère obtenir des pélerinages en échange.
      Le seigneur Albert espère obtenir le paradis en faisant des dons à l'Église, la charité et en faisant faire à ses fils 5 pélerinages à sa place.
      Pèlerinage : voyage vers un lieu saint pour prier sur une relique C'est-à-dire "les restes" d'un saint.
