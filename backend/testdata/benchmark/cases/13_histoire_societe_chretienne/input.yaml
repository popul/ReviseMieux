  - text: |
      Trace écrite :
      Les abbayes sont des lieux où vit le clergé régulier.
      Ce clergé y applique la règle de Saint Benoît (les Bénédictins), c'est-à-dire :
      - partage du temps entre prières pour le salut des morts et travail manuel
      - vie dans des endroits très isolés du monde extérieur
      - ne rien posséder personnellement
      Organisée autour du cloître, une abbaye possède tous les bâtiments nécessaires à une vie à l'écart du monde. Les moines prient dans l'église, discutent de l'organisation dans la salle capitulaire, préparent les repas dans la cuisine, se restaurent dans le réfectoire, se reposent dans le dortoir, sont soignés dans l'infirmerie.
      Salut : vie après la mort dans le royaume de Dieu, espérée par les croyants. (paradis)
      Salle capitulaire : salle où les moines ou les moniales se réunissent pour lire les règles de leur ordre ou discuter de l'organisation de la journée
    block_type: TEXT
    confidence: 1
