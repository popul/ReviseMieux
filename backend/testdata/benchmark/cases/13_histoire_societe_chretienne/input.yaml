  - text: |
      L'abbaye de Fontenay
      L'abbaye de Fontenay a été fondée en Bourgogne en 1119 par Bernard de Clairvaux. Les moines y suivent la règle de Cîteaux, appelée aussi règle cistercienne.
      ① L'église. ② Le cloître. ③ La salle capitulaire (salle de réunion). ④ Salle des moines (copie des manuscrits).
      ⑤ Le dortoir. ⑥ Le chauffoir, seule salle chauffée. ⑦ Le réfectoire et la cuisine. ⑧ La chapelle pour les pauvres et les voyageurs. ⑨ L'hospice où sont accueillis les pauvres, les voyageurs. ⑩ La boulangerie et le four.
      ⑪ La forge. ⑫ Le moulin. ⑬ L'infirmerie. ⑭ Le colombier. ⑮ Le jardin.
    block_type: TEXT
    confidence: 1
  - text: "[Photo : Vue aérienne en noir et blanc de l'abbaye de Fontenay. L'abbaye est organisée autour d'un cloître central. Des bâtiments sont numérotés de ① à ⑮, correspondant à la légende. Une légende indique 'Fontenay, Bourgogne'.]"
