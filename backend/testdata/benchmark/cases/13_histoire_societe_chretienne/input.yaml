      15h30: travail
      18h: office de vêpres à l'église
      18h30: repas du soir, quelques légumes et fruits. Méditation dans le cloître.
      19h30: office de complies à l'église
      20h: repos dans le dortoir
      office religieux - travail - autre (repas, repos ...)
