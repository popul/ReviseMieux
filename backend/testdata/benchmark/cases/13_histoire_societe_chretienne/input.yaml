  - text: Les occupations quotidiennes des moines sont la prière, la lecture de textes religieux et le tracail manuel.
    block_type: TEXT
    confidence: 1
  - text: |
      Une vie exemplaire
      Écrite au début du VIe siècle, par Benoît, abbé du mont Cassin (Italie), La Règle est un guide spirituel et pratique pour vivre l'Évangile à travers trois activités principales : la prière, la lecture et le travail manuel. Les moines obéissent à cette règle.
      « Le premier degré d'humilité est l'obéissance sans délai. Elle convient à ceux qui n'ont rien de plus cher que le Christ. [...] Se remettant toujours devant les yeux la crainte de Dieu, il consiste à fuir toute négligence et à se rappeler sans cesse tout ce que Dieu a commandé. [...] 
      L'oisiveté est ennemie de l'âme. Les frères doivent donc consacrer certaines heures au travail des mains et d'autres à la lecture des choses divines. »
      Extraits de La Règle de saint Benoît, VIe siècle.
    block_type: TEXT
    confidence: 1
  - text: |
      3- A quoi les moines passent-ils la plus grande partie de leur journée ?
       Les moines passent la plus grande partie de leur journée à la prière.
