notes: Cours d'histoire sur l'Église et la société chrétienne au Moyen Âge. Contenu coverant l'organisation de l'Église (pape, clergé séculier et régulier), le clergé régulier (abbayes, vie monastique, règle de saint Benoît), l'encadrement de la société par l'Église (sacres, confession, pèlerinages), l'art roman (architecture, voûte en berceau, tympan), et le contrôle de la société (Inquisition). Includes des schémas et tableaux (organisation de l'Église, emploi du temps d'un moine, plan de l'église romane).
