  - text: "ACTIVITÉ DOCUMENTAIRE : Quels sont les dangers électriques dans une maison ?"
    block_type: TEXT
    confidence: 1
  - text: "1- Retrouver sur le dessin six situations dangereuses et les décrire en quelques mots"
    block_type: TEXT
    confidence: 1
  - text: "2- Rédiger les règles (une règle une phrase) à suivre dans une maison pour éviter les accidents électriques (il peut y en avoir qui ne figure pas sur le dessin)"
    block_type: TEXT
    confidence: 1
