blocks:
  - text: Les circuits électriques
    block_type: TEXT
    confidence: 1
  - text: "1- Qu'est-ce qu'un circuit électrique?"
    block_type: TEXT
    confidence: 1
  - text: "1 Définition"
    block_type: TEXT
    confidence: 1
  - text: "Dipôle : élément électrique qui a 2 bornes."
    block_type: TEXT
    confidence: 1
  - text: "Générateur : élément électrique qui fournit le courant."
    block_type: TEXT
    confidence: 1
  - text: "Récepteur : élément électrique qui reçoit le courant."
    block_type: TEXT
    confidence: 1
  - text: "Boucle de courant : chemin parcouru par le courant dans un circuit."
    block_type: TEXT
    confidence: 1
  - text: "2- Comment allumer une ampoule?"
    block_type: TEXT
    confidence: 1
  - text: "ACTIVITÉ EXPÉRIMENTALE :"
    block_type: TEXT
    confidence: 1
  - text: Comment réaliser un montage permettant de faire fonctionner une ampoule ?
    block_type: TEXT
    confidence: 1
  - text: Ce soir, EDF va couper l'alimentation électrique pour procéder à des travaux. Tu auras besoin de t'éclairer et tu n'as pas de bougie. Comment vas-tu faire pour faire fonctionner l'ampoule ? (On veut pouvoir l'allumer et l'éteindre.)
    block_type: TEXT
    confidence: 1
  - text: "① L'EXPÉRIENCE QUE JE SOUHAITE RÉALISER :"
    block_type: TEXT
    confidence: 1
  - text: "Liste du matériel :"
    block_type: TEXT
    confidence: 1
  - text: "Dessin :"
    block_type: TEXT
    confidence: 1
  - text: "[Dessin manuscrit d'un circuit électrique simple : une pile rectangulaire avec un + et un - visibles, deux fils sortant de chaque borne, connectés à une ampoule (représentée par un ovale avec un fil en zigzag à l'intérieur). Un interrupteur est dessiné sur l'un des fils, en position ouverte. Le dessin est fait au stylo rouge.]"
    block_type: DIAGRAM
    confidence: 1
  - text: "② Quel matériel faut-il au minimum pour faire briller une ampoule?"
    block_type: TEXT
    confidence: 1
  - text: Il faut une pile
    block_type: TEXT
    confidence: 1
  - text: "③ Quelle forme d'énergie reçoit l'ampoule de la part du générateur ?"
    block_type: TEXT
    confidence: 1
  - text: L'énergie électrique
    block_type: TEXT
    confidence: 1
  - text: "④ Que fait-elle de cette énergie reçue ?"
    block_type: TEXT
    confidence: 1
  - text: L'énergie va fournir en faisant briller l'ampoule
    block_type: TEXT
    confidence: 1
  - text: "⑤ A quelle forme d'énergie cela correspond-il ?"
    block_type: TEXT
    confidence: 1
  - text: De l'énergie lumineuse
    block_type: TEXT
    confidence: 1
  - text: "⑥ Si l'on touche l'ampoule après quelques minutes : que constate-t-on ?"
    block_type: TEXT
    confidence: 1
  - text: L'ampoule est chaude
    block_type: TEXT
    confidence: 1
  - text: "⑦ Quelle est cette forme d'énergie ?"
    block_type: TEXT
    confidence: 1
  - text: C'est de l'énergie thermique
    block_type: TEXT
    confidence: 1
  - text: CONCLUSION
    block_type: TEXT
    confidence: 1
  - text: Pour qu'une lampe s'allume la présence d'un générateur dans le circuit est nécessaire. Le générateur transfère de l'énergie électrique aux récepteurs qui la convertissent en d'autres formes. Pour qu'il y ait transfert d'énergie le circuit doit être fermé.
    block_type: TEXT
    confidence: 1
  - text: "La chaine énergétique d'une lampe est :"
    block_type: TEXT
    confidence: 1
  - text: "[Diagramme : Un rectangle étiqueté 'Pile' pointe vers un ovale étiqueté 'Lampe' avec une flèche étiquetée 'Energie électrique (Électricité)'. Deux flèches sortent de l'ovale 'Lampe' : une vers la droite étiquetée 'Energie lumineuse (lumière)' et une vers le bas étiquetée 'Energie thermique (chaleur)'.]"
    block_type: DIAGRAM
    confidence: 1
  - text: "1- Comment schématiser un circuit électrique ?"
    block_type: TEXT
    confidence: 1
  - text: "1- Les éléments d'un circuit électrique"
    block_type: TEXT
    confidence: 1
  - text: "[Tableau : Deux lignes. Première ligne : 'élément' avec les valeurs 'Pile', 'Générateur', 'Interrupteur ouvert', 'Interrupteur fermé', 'fil de connexion'. Deuxième ligne : 'symbole' avec les symboles correspondants : pile (+|-), générateur (cercle avec G et +|-), interrupteur ouvert (ligne brisée), interrupteur fermé (ligne continue), fil (ligne droite).]"
    block_type: TABLE
    confidence: 1
  - text: "[Tableau : Deux lignes. Première ligne : 'élément' avec les valeurs 'lampe', 'moteur', 'Diode', 'DEL (Diode Electro Luminescente)', 'Résistance'. Deuxième ligne : 'Symbole' avec les symboles correspondants : lampe (cercle avec croix), moteur (cercle avec M), diode (triangle avec barre), DEL (triangle avec flèches sortantes), résistance (rectangle avec R).]"
    block_type: TABLE
    confidence: 1
  - text: "2- Comment schématiser un circuit électrique ?"
    block_type: TEXT
    confidence: 1
  - text: "FICHE MÉTHODE : COMMENT SCHÉMATISER UN CIRCUIT ÉLECTRIQUE ?"
    block_type: TEXT
    confidence: 1
  - text: La schématisation peut se faire à partir d'une photo ou d'un texte.
    block_type: TEXT
    confidence: 1
  - text: "[Photo : Vue en plongée d'un circuit électrique réel sur une table. On distingue une pile, des fils noirs et rouges, et deux lampes. Le texte sous l'image est 'PHOTO'.]"
    block_type: DIAGRAM
    confidence: 1
  - text: "[Schéma : Représentation normalisée du circuit. Un rectangle avec un générateur (G) en haut, deux lampes (symbole croix dans cercle) en bas, et deux points noirs sur le côté droit. Le texte sous l'image est 'SCHÉMA'.]"
    block_type: DIAGRAM
    confidence: 1
  - text: "① S'il s'agit d'une photo, il faut d'abord observer le circuit et identifier les éléments."
    block_type: TEXT
    confidence: 1
  - text: "② Dans les deux cas (photos et texte) associer les éléments à leurs symboles en utilisant le tableau des symboles."
    block_type: TEXT
    confidence: 1
  - text: "③ Tracer proprement au crayon à papier et à la règle un rectangle représentant les fils de connexion."
    block_type: TEXT
    confidence: 1
  - text: "④ Placer les symboles normalisés au milieu des côtés du rectangle. Respecter l'ordre et le sens de branchement de chaque dipôle. On place souvent la pile ou le générateur sur le côté supérieur du rectangle."
    block_type: TEXT
    confidence: 1
  - text: "Remarques : Il ne faut pas"
    block_type: TEXT
    confidence: 1
  - text: "- mettre tous les éléments sur le même côté du rectangle."
    block_type: TEXT
    confidence: 1
  - text: "- placer de symbole dans les angles du rectangle."
    block_type: TEXT
    confidence: 1
  - text: "- indiquer le nom des éléments représentés."
    block_type: TEXT
    confidence: 1
