  - text: "2- Ne pas utiliser l'eau à côté du courant."
    block_type: TEXT
    confidence: 1
  - text: "- Ne pas mettre ses doigts dans les prises."
    block_type: TEXT
    confidence: 1
  - text: "- Ne pas laisser allumer les appareils quand on ne les utilise pas."
    block_type: TEXT
    confidence: 1
  - text: "- Faire attention aux éléments électriques pour ne pas provoquer de courts-circuits ou mettre le feu."
    block_type: TEXT
    confidence: 1
  - text: "③ Observation :"
    block_type: TEXT
    confidence: 1
  - text: a- La lampe brille toujours
    block_type: TEXT
    confidence: 1
  - text: b- Le sens de la rotation du moteur change
    block_type: TEXT
    confidence: 1
  - text: c- La DEL ne brille que pour un sens de branchement
    block_type: TEXT
    confidence: 1
  - text: "Le courant électrique a un sens conventionnel : à l'extérieur du générateur, il circule de la borne + à la borne -."
    block_type: TEXT
    confidence: 1
  - text: La DEL et la diode possèdent un sens « passant » et un sens « bloquant » qui conditionne le passage du courant.
    block_type: TEXT
    confidence: 1
  - text: "- Sens du courant"
    block_type: TEXT
    confidence: 1
  - text: "- Boucle de courant"
    block_type: TEXT
    confidence: 1
