# Flow: lib/answer-auto — Repondre automatiquement (MCQ ou texte)
# Detecte le type de question et delegue
# Params:
#   CHOICE_INDEX : index du choix MCQ (defaut: 0 = correct)
#   ANSWER_TEXT  : texte pour les questions libres (defaut: "reponse e2e")
appId: com.revisemieux.app
env:
  CHOICE_INDEX: "0"
  ANSWER_TEXT: "reponse e2e"
---

- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "session-question-text"

# MCQ → taper sur le choix
- tapOn:
    id: "session-choice-${CHOICE_INDEX}"
    optional: true

# Texte libre → saisir la reponse
- runFlow:
    when:
      visible:
        id: "session-answer-input"
    commands:
      - tapOn:
          id: "session-answer-input"
      - inputText: "${ANSWER_TEXT}"

- tapOn:
    id: "session-validate-btn"

- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "session-next-btn"

- tapOn:
    id: "session-next-btn"
