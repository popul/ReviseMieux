# Flow: 03-dashboard
# ACs: Z5-AC01, Z6-AC04, Z7-AC16
# Source: docs/ux/user-flow-complete.md §Dashboard eleve
#
# Parcours : verifier le dashboard apres onboarding
appId: com.revisemieux.app
---

