- assertVisible:
    id: "dashboard-chapter-card"

# La barre mastery doit etre visible
- assertVisible:
    id: "mastery-bar"

# Le bouton capture doit exister
- assertVisible:
    id: "dashboard-capture-btn"

# Le bouton reviser doit exister
- assertVisible:
    id: "dashboard-revise-btn"
