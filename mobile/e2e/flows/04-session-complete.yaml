# Flow: 04-session-complete
# ACs: Z4-AC04, Z4-AC05, Z4-AC09, Z6-AC05
appId: com.revisemieux.app
---

- launchApp

- extendedWaitUntil:
    timeout: 15000
    visible: ".*Hugo.*"

# Seed si besoin
- tapOn:
    text: ".*chapitre.*mo.*"
    optional: true

# Attendre le chargement
- extendedWaitUntil:
    timeout: 15000
    visible: ".*Capturer.*"

# Taper sur "Réviser"
- tapOn:
    text: ".*viser.*"
    optional: true

- extendedWaitUntil:
    timeout: 10000
    visible: ".*"
