# Flow: 01-onboarding-demo — Version courte pour video maestro (<2 min)
# Meme parcours que 01-onboarding mais 3 questions au lieu de 8
# Puis quitte la session pour rester sous la limite de 2 min
appId: com.revisemieux.app
---

- launchApp

# === DASHBOARD ===
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "dashboard-capture-btn"
- tapOn:
    id: "dashboard-seed-demo-btn"
    optional: true
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "dashboard-chapter-card"
- assertVisible:
    id: "mastery-bar"

# === CARTE LECON ===
- tapOn:
    id: "dashboard-chapter-card"
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "chapter-revise-btn"

# === SESSION — 3 questions ===
- tapOn:
    id: "chapter-revise-btn"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "session-question-text"

- runFlow: courses/demo-densite/session-3-quick.yaml

# === QUITTER → retour chapitre → retour dashboard ===
- tapOn:
    id: "session-quit-btn"
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "chapter-revise-btn"
- tapOn:
    id: "header-back-btn"
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "dashboard-chapter-card"
- assertVisible:
    id: "mastery-bar"
