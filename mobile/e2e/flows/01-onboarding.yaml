# Flow: 01-onboarding — Parcours complet premier lancement
# ACs: Z8-AC01, Z8-AC02, Z4-AC04, Z4-AC09
#
# Cours demo : "Densite et masse volumique" (8 items, 3 notions)
# Reponses definies dans courses/demo-densite/
# Video : make mobile-e2e-flow FLOW=01-onboarding MODE=maestro
#
# Note : maestro record --local limite a 2 min
# Les timeouts sont reduits pour rester sous cette limite
appId: com.revisemieux.app
---

- launchApp

# === DASHBOARD ===
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "dashboard-capture-btn"
- tapOn:
    id: "dashboard-seed-demo-btn"
    optional: true
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "dashboard-chapter-card"
- assertVisible:
    id: "mastery-bar"

# === CARTE LECON ===
- tapOn:
    id: "dashboard-chapter-card"
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "chapter-revise-btn"
- assertVisible:
    id: "chapter-item-list"

# === SESSION — 8 questions ===
- tapOn:
    id: "chapter-revise-btn"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "session-question-text"
- assertVisible:
    id: "session-progress-bar"

- runFlow: courses/demo-densite/session-8-all-correct.yaml

# === DEBRIEF — verifier le score 8/8 ===
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "debrief-score-card"
- copyTextFrom:
    id: "debrief-percentage"
- assertTrue:
    condition: "${maestro.copiedText.includes('87') || maestro.copiedText.includes('100')}"
    label: "Score >= 87%"
- assertVisible:
    id: "debrief-back-btn"
- assertVisible:
    id: "debrief-again-btn"

# === RETOUR AU CHAPITRE ===
- tapOn:
    id: "debrief-back-btn"
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "chapter-revise-btn"

# === RETOUR AU DASHBOARD ===
- tapOn:
    id: "header-back-btn"
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "dashboard-chapter-card"
- assertVisible:
    id: "mastery-bar"
