# Flow: 01-onboarding
# ACs: Z8-AC01, Z8-AC02, Z8-AC08
appId: com.revisemieux.app
---

- launchApp


# Attendre le chargement complet (15s max)
- extendedWaitUntil:
    timeout: 15000
    visible: ".*Hugo.*"

# Le dashboard est visible
- assertVisible: ".*Hugo.*"

# Seed demo si DB vierge
- tapOn:
    text: ".*chapitre.*mo.*"
    optional: true

# Attendre le seed
- extendedWaitUntil:
    timeout: 10000
    visible: ".*Capturer.*"

# Verifier le bouton capture
- assertVisible: ".*Capturer.*"
