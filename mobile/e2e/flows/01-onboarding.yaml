# Flow: 01-onboarding — Parcours complet premier lancement
# ACs: Z8-AC01, Z8-AC02, Z4-AC04, Z4-AC09
#
# Cours demo : "Densite et masse volumique" (8 items, 3 notions)
# Reponses definies dans courses/demo-densite/
# Video : make mobile-e2e-flow FLOW=01-onboarding
appId: com.revisemieux.app
---

- launchApp

# === DASHBOARD ===
- extendedWaitUntil:
    timeout: 20000
    visible:
      id: "dashboard-capture-btn"
- tapOn:
    id: "dashboard-seed-demo-btn"
    optional: true
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: "dashboard-chapter-card"
- assertVisible:
    id: "mastery-bar"

# === CARTE LECON ===
- tapOn:
    id: "dashboard-chapter-card"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "chapter-revise-btn"
- assertVisible:
    id: "chapter-item-list"

# === SESSION — 8 questions ===
- tapOn:
    id: "chapter-revise-btn"
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: "session-question-text"
- assertVisible:
    id: "session-progress-bar"

- runFlow: courses/demo-densite/session-8-questions.yaml

# === DEBRIEF ===
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: "debrief-score-card"
- assertVisible:
    id: "debrief-score"
- assertVisible:
    id: "debrief-percentage"
- assertVisible:
    id: "debrief-back-btn"
- assertVisible:
    id: "debrief-again-btn"

# === RETOUR AU DASHBOARD ===
# "Retour au chapitre" fait router.dismissAll() → retour direct au dashboard
- tapOn:
    id: "debrief-back-btn"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "dashboard-chapter-card"
- assertVisible:
    id: "mastery-bar"
