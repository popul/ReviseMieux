# Bonne reponse — generique, utilise les mots-cles du cours via ${CORRECT_KEYWORDS}
appId: com.revisemieux.app
---

- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "session-question-text"

# MCQ → premier choix (correct)
- tapOn:
    id: "session-choice-0"
    optional: true

# Texte libre → mots-cles du cours
- runFlow:
    when:
      visible:
        id: "session-answer-input"
    commands:
      - tapOn:
          id: "session-answer-input"
      - inputText: "${CORRECT_KEYWORDS}"

- tapOn:
    id: "session-validate-btn"

- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "session-next-btn"

- tapOn:
    id: "session-next-btn"
