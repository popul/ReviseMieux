# Flow: session-8-all-correct — Cours demo "Densite et masse volumique"
#
# 8 items, toutes bonnes reponses
# Ordre reel : MCQ, TEXT, TEXT, MCQ, TEXT, TEXT, MCQ, TEXT
# Les reponses texte incluent assez de mots-cles pour score >= 0.7
appId: com.revisemieux.app
---

# Q1 — MCQ (Vrai/Faux) : masse volumique = rapport masse/volume
- runFlow:
    file: ../../lib/answer-choice.yaml
    env:
      CHOICE_INDEX: "0"

# Q2 — TEXT : unite SI de la masse volumique
- runFlow:
    file: ../../lib/answer-text.yaml
    env:
      ANSWER_TEXT: "kilogramme par metre cube kg/m3 unite SI masse volumique"

# Q3 — TEXT : rho = m / V (formule)
- runFlow:
    file: ../../lib/answer-text.yaml
    env:
      ANSWER_TEXT: "rho est la formule masse volumique egale masse divise volume"

# Q4 — MCQ (Vrai/Faux) : densite = masse volumique / eau
- runFlow:
    file: ../../lib/answer-choice.yaml
    env:
      CHOICE_INDEX: "0"

# Q5 — TEXT : un corps flotte si densite < 1
- runFlow:
    file: ../../lib/answer-text.yaml
    env:
      ANSWER_TEXT: "un corps flotte si sa densite est inferieure a 1"

# Q6 — TEXT : masse volumique de l'eau = 1000 kg/m3
- runFlow:
    file: ../../lib/answer-text.yaml
    env:
      ANSWER_TEXT: "masse volumique eau 1000 kg/m3 1 g/cm3"

# Q7 — MCQ (Vrai/Faux) : conversion g/cm3 en kg/m3 x1000
- runFlow:
    file: ../../lib/answer-choice.yaml
    env:
      CHOICE_INDEX: "0"

# Q8 — TEXT : masse volumique permet identifier un materiau
- runFlow:
    file: ../../lib/answer-text.yaml
    env:
      ANSWER_TEXT: "la masse volumique permet identifier un materiau inconnu"
