# Flow: answer-wrong — Mauvaise reponse (generique)
# MCQ : choix 1 (incorrect) + validate obligatoire
# Texte libre : "Je ne sais pas" (skip soumet directement)
appId: com.revisemieux.app
---

- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "session-question-text"

# MCQ → deuxieme choix (incorrect) + validate
- runFlow:
    when:
      visible:
        id: "session-choice-1"
    commands:
      - tapOn:
          id: "session-choice-1"
      - tapOn:
          id: "session-validate-btn"

# Texte libre → "Je ne sais pas" (skip soumet directement, pas besoin de validate)
- tapOn:
    id: "session-skip-btn"
    optional: true

- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "session-next-btn"

- tapOn:
    id: "session-next-btn"
