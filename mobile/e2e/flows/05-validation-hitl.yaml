# Flow: 05-validation-hitl — Verification app demarre correctement
# ACs: Z3-AC06 (chapitre utilisable avec 0 validations)
#
# Scenario court : dashboard → chapitre demo → carte lecon visible
# Verifie que l'app fonctionne sans ValidationTasks
appId: com.revisemieux.app
---

- launchApp

# Dashboard charge
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "dashboard-capture-btn"
- tapOn:
    id: "dashboard-seed-demo-btn"
    optional: true
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "dashboard-chapter-card"
- assertVisible:
    id: "mastery-bar"

# Ouvrir le chapitre
- tapOn:
    id: "dashboard-chapter-card"
- extendedWaitUntil:
    timeout: 5000
    visible:
      id: "chapter-revise-btn"
- assertVisible:
    id: "chapter-item-list"
